# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Packages that peer-depend on each other must move in the same group,
      # or each group's PR fails `npm ci` with ERESOLVE (as #19 and #25 did:
      # @vitest/coverage-v8 5 landed without vitest 5).
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "vitest"
          - "@vitest/*"
          - "prettier"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "vitest"
          - "@vitest/*"
          - "prettier"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"
